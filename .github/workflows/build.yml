name: build

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen || brew install xcodegen
          fi
          xcodegen --version

      - name: Generate project
        run: xcodegen generate

      - name: Pin Xcode
        run: |
          if [ -d /Applications/Xcode_26.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app
          fi
          xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Qingxiang.xcodeproj -scheme Qingxiang -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            SYMROOT="$(pwd)/build" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -300

      - name: Verify binary
        run: |
          APP="$(find build -name Qingxiang.app -path '*Release-iphoneos*' | head -1)"
          [ -n "$APP" ] || { echo "APP NOT FOUND"; find build -maxdepth 2 -name '*.app' || true; exit 1; }
          BIN="$APP/Qingxiang"
          [ -f "$BIN" ] || { echo "NO MAIN BINARY - fake success"; exit 1; }
          ls -lh "$BIN"

      - name: Package IPA
        run: |
          APP="$(find build -name Qingxiang.app -path '*Release-iphoneos*' | head -1)"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr Qingxiang-v2.2.0-unsigned.ipa Payload
          ls -lh Qingxiang-v2.2.0-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qingxiang-ipa
          path: Qingxiang-v2.2.0-unsigned.ipa
